name: CI - Python

on:
  push:
    branches: [ "main", "developer", "teste" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4.2.2

    - name: Configurar o Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Instalar o Pytest, Mock e Conector MySQL
      run: |
        # Instalamos as ferramentas de teste E o conector que o seu database.py exige
        pip install pytest pytest-mock mysql-connector-python

    - name: Executar o Teste Específico das Ocorrencias
      run: pytest tests/test_report.py
